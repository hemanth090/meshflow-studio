name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check generated bundle
        run: node --check client.js

      - name: Build bundle from sources
        run: node build.mjs

      - name: Verify client.js is in sync with src/
        run: git diff --exit-code -- client.js

      - name: Run tests
        run: node --test test/*.mjs
